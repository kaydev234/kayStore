<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kay Store - Cart</title>
<link href="bootstrap-5.3.3-dist/bootstrap.css" rel="stylesheet">
<style>
    body {
        background-color: #f5f5f5;
        font-family: Arial, sans-serif;
    }
    .navbar {
        background-color: #ff9900 !important;
    }
    .navbar-brand, .nav-link {
        color: white !important;
    }
    .cart-badge {
        background-color: red;
        color: white;
        border-radius: 50%;
        padding: 4px 8px;
        font-size: 12px;
        vertical-align: top;
        margin-left: 5px;
    }
    .cart-container {
        background: white;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    table img {
        border-radius: 5px;
    }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="shop.html">Kay Store</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a href="shop.html" class="nav-link">
                    Cart <span id="cart-count" class="cart-badge">0</span>
                </a>
            </li>
        </ul>
    </div>
</nav>

<!-- Cart Table -->
<div class="container mt-4">
    <div class="cart-container">
        <h3 class="mb-3">Your Shopping Cart</h3>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price ($)</th>
                        <th>Quantity</th>
                        <th>Total ($)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="cart-items"></tbody>
            </table>
        </div>
        <div class="text-end fw-bold fs-5 mt-3">
            Total: $<span id="cart-total">0</span>
        </div>
    </div>
</div>

<script src="bootstrap-5.3.3-dist/bootstrap.bundle.js"></script>
<script>
function updateCartBadge() {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let count = cart.reduce((acc, item) => acc + (item.quantity || 0), 0);
    document.getElementById('cart-count').textContent = count;
}

function renderCart() {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let cartItemsContainer = document.getElementById('cart-items');
    cartItemsContainer.innerHTML = '';
    let total = 0;

    cart.forEach((item, index) => {
        let itemTotal = item.price * item.quantity;
        total += itemTotal;
        cartItemsContainer.innerHTML += `
            <tr>
                <td><img src="${item.image}" width="50"> ${item.name}</td>
                <td>${item.price}</td>
                <td>
                    <input type="number" min="0" value="${item.quantity}" data-index="${index}" class="form-control quantity-input">
                </td>
                <td>${itemTotal.toFixed(2)}</td>
                <td><button class="btn btn-danger btn-sm remove-item" data-index="${index}">Remove</button></td>
            </tr>
        `;
    });

    document.getElementById('cart-total').textContent = total.toFixed(2);
    updateCartBadge();
}

document.addEventListener('click', function(e) {
    if (e.target.classList.contains('remove-item')) {
        let index = e.target.getAttribute('data-index');
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }
});

document.addEventListener('input', function(e) {
    if (e.target.classList.contains('quantity-input')) {
        let index = e.target.getAttribute('data-index');
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let newQty = parseInt(e.target.value);
        if (newQty <= 0) {
            cart.splice(index, 1);
        } else {
            cart[index].quantity = newQty;
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }
});

renderCart();
</script>

</body>
</html>
